<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra cách đọc Kanji – Somatome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #222222;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --soft: #f6f7f9;
    --indigo: #2b4c7e;
    --ok: #1f7a4a;
    --ok-bg: #e9f6ee;
    --bad: #b3261e;
    --bad-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  .jp { font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; }
  .wrap { max-width: 660px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }

  .setup { display: grid; gap: 14px; }
  label.field { display: grid; gap: 6px; font-weight: 500; }
  select, input[type=number] {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  .check { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--indigo); background: var(--indigo); color: #fff;
    padding: 11px 18px; font-weight: 500;
  }
  button.ghost { background: #fff; color: var(--indigo); }
  button:focus-visible, select:focus-visible, .opt:focus-visible { outline: 3px solid #9db7e0; outline-offset: 2px; }

  .bar { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 28px; }
  .progress span { display: block; height: 100%; background: var(--indigo); width: 0; transition: width .2s; }

  .word { font-size: clamp(2.6rem, 11vw, 4rem); font-weight: 500; text-align: center; margin: 8px 0 4px; letter-spacing: .04em; }
  .tag { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 24px; }

  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%;
    text-align: left; background: #fff; color: var(--ink);
    border: 1px solid var(--line); padding: 12px 14px; font-weight: 400;
  }
  .opt:hover:not(:disabled) { border-color: var(--indigo); }
  .key {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 600; font-size: .85rem;
    border: 1px solid var(--line); color: var(--muted);
  }
  .opt .kana { font-size: 1.25rem; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.correct .key { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }

  /* Phần giải thích */
  .explain { display: none; margin: 20px 0 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .explain.show { display: block; }
  .verdict { padding: 12px 16px; font-weight: 600; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .ex-body { padding: 14px 16px 16px; display: grid; gap: 16px; }
  .ex-word { font-size: 1.6rem; font-weight: 500; }
  .ex-word small { font-size: 1.1rem; color: var(--indigo); margin-left: 6px; }
  .ex-meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .95rem; }
  .ex-meta dt { color: var(--muted); }
  .ex-meta dd { margin: 0; }
  .ex-h { font-weight: 600; font-size: .95rem; margin: 0 0 6px; }
  .kanji-list { display: grid; gap: 8px; }
  .kanji-item { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .kanji-item .big { font-size: 1.8rem; line-height: 1.1; text-align: center; }
  .kanji-item .hv { font-weight: 600; }
  .kanji-item .rd { font-size: .92rem; color: var(--ink); }
  .kanji-item .rd span { color: var(--muted); }
  .ex-sent { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--indigo); }
  .ex-sent .jp { font-size: 1rem; }
  .ex-sent b { color: var(--indigo); font-weight: 700; }
  .ex-sent .vi { color: var(--muted); font-size: .9rem; }
  .opt-ex { display: grid; gap: 8px; }
  .opt-ex-row { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: .95rem; }
  .opt-ex-row .key { width: 24px; height: 24px; font-size: .75rem; }
  .opt-ex-row.right .key { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt-ex-row.picked .key { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt-ex-row .rk { font-size: 1.05rem; }
  .opt-ex-row .why { color: var(--muted); display: block; }

  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 18px; }

  .score { font-size: 2.4rem; font-weight: 600; text-align: center; margin: 12px 0 0; }
  .score-sub { text-align: center; color: var(--muted); margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td .bad { color: var(--bad); }
  .tablewrap { overflow-x: auto; margin-bottom: 20px; }
  .hidden { display: none !important; }
  .timer-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .timer-track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: var(--indigo); }
  .timer-fill.low { background: var(--bad); }
  .timer-num { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; font-weight: 600; }
  .timer-row button { padding: 6px 12px; font-size: .9rem; }
  .opts.paused { opacity: .25; pointer-events: none; filter: blur(3px); }
  .paused-note { text-align: center; color: var(--muted); margin: -8px 0 12px; }
  .inline { display: flex; gap: 10px; align-items: center; }
  .inline input[type=number] { width: 90px; }
  @media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <section id="setup">
    <h1>Kiểm tra cách đọc Kanji</h1>
    <p class="sub">Somatome N3 · Chọn cách đọc đúng của từ vựng</p>
    <div class="setup">
      <label class="field">Tuần <select id="week"></select></label>
      <label class="field">Ngày <select id="day"></select></label>
      <label class="field">Số câu (để trống = tất cả)
        <input type="number" id="limit" min="1" placeholder="Tất cả">
      </label>
      <label class="check"><input type="checkbox" id="shuffle" checked> Đảo thứ tự câu hỏi</label>
      <div class="inline">
        <label class="check"><input type="checkbox" id="useTimer" checked> Giới hạn thời gian mỗi câu</label>
        <input type="number" id="secs" min="3" max="120" value="10"> giây
      </div>
      <div class="actions" style="justify-content:flex-start"><button id="startBtn">Bắt đầu</button></div>
      <p class="sub" id="countInfo" style="margin:0"></p>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="bar"><span id="qnum"></span><span id="qscore"></span></div>
    <div class="progress"><span id="pbar"></span></div>
    <div class="word jp" id="qword"></div>
    <div class="tag" id="qtag"></div>
    <div class="timer-row" id="timerRow">
      <div class="timer-track"><div class="timer-fill" id="tfill"></div></div>
      <span class="timer-num" id="tnum"></span>
      <button class="ghost" id="pauseBtn">Tạm dừng</button>
    </div>
    <p class="paused-note hidden" id="pausedNote">Đang tạm dừng. Bấm “Tiếp tục” để làm tiếp.</p>
    <div class="opts" id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="actions">
      <button class="ghost" id="quitBtn">Dừng</button>
      <button id="nextBtn" disabled>Câu tiếp</button>
    </div>
    <p class="hint">Phím tắt: A/B/C/D hoặc 1–4 để chọn, Enter để sang câu tiếp, P để tạm dừng/tiếp tục</p>
  </section>

  <section id="result" class="hidden">
    <h1>Kết quả</h1>
    <div class="score" id="rscore"></div>
    <div class="score-sub" id="rsub"></div>
    <div id="wrongWrap">
      <h2 style="font-size:1.05rem;font-weight:600">Các câu sai</h2>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Từ</th><th>Đáp án đúng</th><th>Bạn chọn</th><th>Hán Việt</th><th>Nghĩa</th></tr></thead>
          <tbody id="wrongList"></tbody>
        </table>
      </div>
    </div>
    <div class="actions" style="justify-content:flex-start">
      <button id="retryWrongBtn">Làm lại câu sai</button>
      <button class="ghost" id="restartBtn">Chọn bài khác</button>
    </div>
  </section>
</div>

const KANJI = {};
KANJI_RAW.trim().split("\n").forEach(l => {
  const [c, hv, on, kun] = l.split("|");
  KANJI[c] = { hv, on, kun };
});
EX_RAW.trim().split("\n").forEach(l => {
  const [c, jp, vi] = l.split("|");
  if (KANJI[c]) KANJI[c].ex = { jp, vi };
});
const WORDS = [];
let curW = 0, curD = 0;
RAW.trim().split("\n").forEach(line => {
  line = line.trim();
  if (!line) return;
  if (line.startsWith("#")) { [curW, curD] = line.slice(1).split("-").map(Number); return; }
  const [word, reading, hv, meaning] = line.split("|");
  WORDS.push({ week: curW, day: curD, word, reading, hv, meaning });
});
const ALL_READINGS = [...new Set(WORDS.map(w => w.reading))];
const BY_READING = {};
WORDS.forEach(w => (BY_READING[w.reading] = BY_READING[w.reading] || []).push(w));

// ===== Tạo đáp án nhiễu kèm lý do =====
const VOICE_GROUPS = ["かが","きぎ","くぐ","けげ","こご","さざ","しじ","すず","せぜ","そぞ","ただ","ちぢ","つづ","てで","とど","はばぱ","ひびぴ","ふぶぷ","へべぺ","ほぼぽ"];
const VOICE = {};
VOICE_GROUPS.forEach(g => [...g].forEach(c => VOICE[c] = [...g].filter(x => x !== c)));
const O_U_ROW = new Set([..."おこそとのほもよろごぞどぼぽょうくすつぬふむゆるぐずぶぷゅ"]);
const KSTP = new Set([..."かきくけこさしすせそたちつてとぱぴぷぺぽ"]);
const KANA_ONLY = /^[\u3040-\u30ffー]+$/;

function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function voiceName(c) {
  if (/[がぎぐげござじずぜぞだぢづでどばびぶべぼ]/.test(c)) return "âm đục";
  if (/[ぱぴぷぺぽ]/.test(c)) return "âm bán đục";
  return "âm trong";
}

function variants(r) {
  const out = new Map();
  const ch = [...r];
  const add = (arr, why) => { const s = arr.join(""); if (s && s !== r && KANA_ONLY.test(s) && !out.has(s)) out.set(s, why); };
  for (let i = 0; i < ch.length; i++) {
    const c = ch[i], next = ch[i + 1], prev = ch[i - 1];
    if (c === "う" && i > 0 && O_U_ROW.has(prev))
      add(ch.slice(0, i).concat(ch.slice(i + 1)), `Thiếu trường âm: phải là「${ch.slice(Math.max(0, i - 2), i + 1).join("")}」(có う kéo dài), không phải「${ch.slice(Math.max(0, i - 2), i).join("")}」.`);
    if (O_U_ROW.has(c) && next !== "う" && c !== "う")
      add(ch.slice(0, i + 1).concat(["う"], ch.slice(i + 1)), `Thừa trường âm: chỗ「${ch.slice(Math.max(0, i - 1), i + 1).join("")}」là âm ngắn, không kéo dài thành「${ch.slice(Math.max(0, i - 1), i + 1).join("")}う」.`);
    if (VOICE[c]) VOICE[c].forEach(v => {
      const t = ch.slice(); t[i] = v;
      add(t, `Sai âm đục/trong: đúng là「${c}」(${voiceName(c)}), không phải「${v}」(${voiceName(v)}).`);
    });
    if (c === "っ") {
      add(ch.slice(0, i).concat(ch.slice(i + 1)), `Thiếu âm ngắt「っ」: từ này có âm lặp (ví dụ「${ch.slice(Math.max(0, i - 1), i + 2).join("")}」).`);
      const t = ch.slice(); t[i] = "つ";
      add(t, `「っ」ở đây là âm ngắt nhỏ, không đọc thành「つ」to.`);
    }
    if (i > 0 && KSTP.has(c) && prev !== "っ" && prev !== "ん")
      add(ch.slice(0, i).concat(["っ"], ch.slice(i)), `Thừa âm ngắt「っ」: giữa「${prev}」và「${c}」không có âm ngắt.`);
    if (c === "ゅ" || c === "ょ") {
      const t = ch.slice(); t[i] = c === "ゅ" ? "ょ" : "ゅ";
      add(t, `Nhầm âm ghép: đúng là「${ch.slice(i - 1, i + 1).join("")}」, không phải「${t.slice(i - 1, i + 1).join("")}」.`);
    }
  }
  return [...out.entries()];
}

function makeOptions(item) {
  const answer = item.reading;
  const reasons = {};
  shuffle(variants(answer)).slice(0, 2).forEach(([v, why]) => reasons[v] = why);
  const len = [...answer].length;
  let pool = shuffle(ALL_READINGS.filter(r => r !== answer && !(r in reasons) && Math.abs([...r].length - len) <= 1));
  if (pool.length < 3) pool = shuffle(ALL_READINGS.filter(r => r !== answer && !(r in reasons)));
  for (const r of pool) {
    if (Object.keys(reasons).length >= 3) break;
    const owners = BY_READING[r] || [];
    reasons[r] = owners.length
      ? `Đây là cách đọc của ${owners.map(o => `「${o.word}」(${o.meaning})`).join(", ")}.`
      : "Không phải cách đọc của từ này.";
  }
  return { opts: shuffle([answer, ...Object.keys(reasons)]), reasons };
}

function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }
function drawTimer() {
  const pct = Math.max(0, remainMs / limitMs) * 100;
  $("tfill").style.width = pct + "%";
  $("tfill").classList.toggle("low", remainMs <= 3000);
  $("tnum").textContent = (Math.max(0, remainMs) / 1000).toFixed(1) + "s";
}
function startTimer() {
  stopTimer();
  setPaused(false);
  $("timerRow").classList.toggle("hidden", !timerOn);
  if (!timerOn) return;
  remainMs = limitMs; lastT = performance.now(); drawTimer();
  tick = setInterval(() => {
    const now = performance.now();
    if (!paused && !answered) {
      remainMs -= now - lastT;
      drawTimer();
      if (remainMs <= 0) { stopTimer(); choose(-1); }
    }
    lastT = now;
  }, 100);
}
function setPaused(v) {
  paused = v;
  $("pauseBtn").textContent = v ? "Tiếp tục" : "Tạm dừng";
  $("opts").classList.toggle("paused", v);
  $("pausedNote").classList.toggle("hidden", !v);
}
function togglePause() { if (timerOn && !answered) setPaused(!paused); }

function fillSelects() {
  const weeks = [...new Set(WORDS.map(w => w.week))];
  $("week").innerHTML = `<option value="0">Tất cả các tuần</option>` + weeks.map(w => `<option value="${w}">Tuần ${w}</option>`).join("");
  updateDays();
}
function updateDays() {
  const w = +$("week").value;
  const days = w ? [...new Set(WORDS.filter(x => x.week === w).map(x => x.day))] : [];
  $("day").innerHTML = `<option value="0">Tất cả các ngày</option>` + days.map(d => `<option value="${d}">Ngày ${d}</option>`).join("");
  $("day").disabled = !w;
  updateCount();
}
function selected() {
  const w = +$("week").value, d = +$("day").value;
  return WORDS.filter(x => (!w || x.week === w) && (!d || x.day === d));
}
function updateCount() { $("countInfo").textContent = `Có ${selected().length} từ trong phần đã chọn.`; }
function show(id) { ["setup", "quiz", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }

function start(list) {
  questions = list.map(item => ({ item, ...makeOptions(item) }));
  idx = 0; score = 0; wrong = [];
  show("quiz");
  render();
}

function render() {
  answered = false;
  const q = questions[idx];
  $("qnum").textContent = `Câu ${idx + 1}/${questions.length}`;
  $("qscore").textContent = `Đúng: ${score}`;
  $("pbar").style.width = `${(idx / questions.length) * 100}%`;
  $("qword").textContent = q.item.word;
  $("qtag").textContent = `Tuần ${q.item.week} · Ngày ${q.item.day}`;
  $("explain").className = "explain";
  $("explain").innerHTML = "";
  $("pauseBtn").disabled = false;
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = idx === questions.length - 1 ? "Xem kết quả" : "Câu tiếp";
  $("opts").innerHTML = q.opts.map((o, i) =>
    `<button class="opt" data-i="${i}"><span class="key">${LETTERS[i]}</span><span class="kana jp">${o}</span></button>`
  ).join("");
  $("opts").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  startTimer();
}

function kanjiBreakdown(word) {
  const seen = new Set();
  const items = [...word].filter(c => KANJI[c] && !seen.has(c) && seen.add(c));
  if (!items.length) return "";
  return `<div><p class="ex-h">Phân tích chữ Hán và câu ví dụ</p><div class="kanji-list">` +
    items.map(c => {
      const k = KANJI[c];
      return `<div class="kanji-item"><div class="big jp">${c}</div><div>
        <div class="hv">${k.hv}</div>
        <div class="rd jp"><span>Âm On:</span> ${k.on || "—"}　<span>Âm Kun:</span> ${k.kun || "—"}</div>
        ${k.ex ? `<div class="ex-sent"><div class="jp">${k.ex.jp.replace(/【(.+?)】/g, '<b>$1</b>')}</div><div class="vi">${k.ex.vi}</div></div>` : ""}
      </div></div>`;
    }).join("") + `</div></div>`;
}

function choose(i) {
  if (answered || (paused && i >= 0)) return;
  answered = true;
  stopTimer();
  $("pauseBtn").disabled = true;
  const q = questions[idx], it = q.item;
  const timeout = i < 0;
  const picked = timeout ? "(hết giờ)" : q.opts[i];
  const ok = picked === it.reading;
  $("opts").querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (q.opts[j] === it.reading) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });
  if (ok) score++; else wrong.push({ item: it, picked });
  $("qscore").textContent = `Đúng: ${score}`;

  const optRows = q.opts.map((o, j) => {
    const isRight = o === it.reading;
    const cls = isRight ? "right" : (j === i ? "picked" : "");
    const why = isRight ? "Đáp án đúng." : q.reasons[o];
    return `<div class="opt-ex-row ${cls}"><span class="key">${LETTERS[j]}</span>
      <div><span class="rk jp">${o}</span>${j === i && !isRight ? " (bạn chọn)" : ""}<span class="why">${why}</span></div></div>`;
  }).join("");

  const ex = $("explain");
  ex.className = "explain show";
  ex.innerHTML =
    `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Chính xác!" : `${timeout ? "Hết giờ!" : "Chưa đúng."} Đáp án đúng là ${LETTERS[q.opts.indexOf(it.reading)]}.`}</div>
     <div class="ex-body">
       <div class="ex-word jp">${it.word}<small>${it.reading}</small></div>
       <dl class="ex-meta">
         ${it.hv ? `<dt>Hán Việt</dt><dd>${it.hv}</dd>` : ""}
         <dt>Nghĩa</dt><dd>${it.meaning}</dd>
       </dl>
       ${kanjiBreakdown(it.word)}
       <div><p class="ex-h">Giải thích các đáp án</p><div class="opt-ex">${optRows}</div></div>
     </div>`;
  $("nextBtn").disabled = false;
  $("nextBtn").focus({ preventScroll: true });
}

function next() {
  if (!answered) return;
  if (idx < questions.length - 1) { idx++; render(); window.scrollTo({ top: 0 }); }
  else finish();
}

function finish() {
  stopTimer();
  show("result");
  const total = questions.length;
  const done = answered ? idx + 1 : idx;
  $("rscore").textContent = `${score}/${done || total}`;
  $("rsub").textContent = done ? `Đúng ${Math.round((score / done) * 100)}%` : "";
  $("wrongWrap").classList.toggle("hidden", wrong.length === 0);
  $("retryWrongBtn").classList.toggle("hidden", wrong.length === 0);
  $("wrongList").innerHTML = wrong.map(w =>
    `<tr><td class="jp">${w.item.word}</td><td class="jp">${w.item.reading}</td><td class="jp"><span class="bad">${w.picked}</span></td><td>${w.item.hv || ""}</td><td>${w.item.meaning}</td></tr>`
  ).join("");
}

$("week").addEventListener("change", updateDays);
$("day").addEventListener("change", updateCount);
$("startBtn").addEventListener("click", () => {
  let list = selected().slice();
  if ($("shuffle").checked) shuffle(list);
  const lim = parseInt($("limit").value, 10);
  if (lim > 0) list = list.slice(0, lim);
  timerOn = $("useTimer").checked;
  limitMs = Math.max(3, parseInt($("secs").value, 10) || 10) * 1000;
  if (list.length) start(list);
});
$("nextBtn").addEventListener("click", next);
$("pauseBtn").addEventListener("click", togglePause);
$("useTimer").addEventListener("change", () => $("secs").disabled = !$("useTimer").checked);
$("quitBtn").addEventListener("click", () => { if (idx > 0 || answered) finish(); else show("setup"); });
$("restartBtn").addEventListener("click", () => show("setup"));
$("retryWrongBtn").addEventListener("click", () => start(shuffle(wrong.map(w => w.item))));

document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  const k = e.key.toUpperCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, "A": 0, "B": 1, "C": 2, "D": 3 };
  if (k === "P") { e.preventDefault(); togglePause(); }
  else if (k in map && !answered) { e.preventDefault(); choose(map[k]); }
  else if (e.key === "Enter" && answered) { e.preventDefault(); next(); }
});

fillSelects();
</script>
</body>
</html>
